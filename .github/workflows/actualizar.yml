name: Actualizar panel de licitaciones

on:
  schedule:
    # Cuatro veces al dia (hora UTC). En Chile en horario de verano (UTC-3) equivalen a
    # ~07:07, ~10:47, ~13:47 y ~18:07. Se usan minutos poco comunes porque GitHub atrasa mas
    # las ejecuciones programadas en horas redondas (en punto y y media), que son las mas usadas.
    - cron: "7 10 * * *"
    - cron: "47 13 * * *"
    - cron: "47 16 * * *"
    - cron: "7 21 * * *"
  workflow_dispatch:   # permite lanzarlo a mano desde la pestana Actions

permissions:
  contents: write      # guardar data/cache.json y docs/data.json
  pages: write         # publicar la pagina
  id-token: write

concurrency:
  group: actualizar-panel
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Consultar Mercado Publico y generar los datos
        env:
          MERCADO_PUBLICO_TICKET: ${{ secrets.MERCADO_PUBLICO_TICKET }}
        run: python actualizar_licitaciones.py

      - name: Guardar los datos en el repositorio
        run: |
          git config user.name "panel-licitaciones"
          git config user.email "panel-licitaciones@users.noreply.github.com"
          git add data/cache.json docs/data.json
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "Actualizacion de datos $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - name: Configurar la publicacion
        uses: actions/configure-pages@v5

      - name: Preparar la pagina
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publicar la pagina
        id: deployment
        uses: actions/deploy-pages@v4
