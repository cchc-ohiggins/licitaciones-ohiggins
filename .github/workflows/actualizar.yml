name: Actualizar panel de licitaciones

on:
  schedule:
    # Ocho disparos al dia (hora UTC): cuatro principales y cuatro de respaldo, unos 55 minutos
    # despues de cada uno. GitHub atrasa o se salta a veces las ejecuciones programadas; el
    # respaldo cubre ese caso. Si el principal si corrio, el respaldo se salta solo (ver el
    # trabajo "revisar"). En Chile en horario de verano (UTC-3) equivalen a:
    #   principales: ~07:07, ~10:47, ~13:47, ~18:07
    #   respaldos:   ~08:02, ~11:42, ~14:42, ~19:02
    # Se usan minutos poco comunes porque GitHub atrasa mas las horas redondas (en punto y y media).
    - cron: "7 10 * * *"
    - cron: "2 11 * * *"
    - cron: "47 13 * * *"
    - cron: "42 14 * * *"
    - cron: "47 16 * * *"
    - cron: "42 17 * * *"
    - cron: "7 21 * * *"
    - cron: "2 22 * * *"
  workflow_dispatch:   # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write      # guardar data/cache.json y docs/data.json
  pages: write         # publicar la página
  id-token: write

concurrency:
  group: actualizar-panel
  cancel-in-progress: false

jobs:
  # Evita actualizaciones duplicadas: en una ejecucion programada, si la pagina PUBLICADA ya se
  # actualizo hace menos de 90 minutos, no se hace nada (no se gasta cupo de la API). Se mira la
  # pagina publicada y no el repositorio, para que una publicacion fallida se reintente en la
  # siguiente ejecucion. Las ejecuciones manuales (boton "Run workflow") siempre actualizan, y si
  # no se puede leer la pagina, tambien se actualiza.
  revisar:
    runs-on: ubuntu-latest
    outputs:
      saltar: ${{ steps.chequeo.outputs.saltar }}
    steps:
      - name: Revisar cuando se publico por ultima vez
        id: chequeo
        env:
          EVENTO: ${{ github.event_name }}
          URL_DATOS: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys, time, urllib.request
          from datetime import datetime, timezone
          saltar = "false"
          if os.environ.get("EVENTO") == "schedule":
              try:
                  url = os.environ["URL_DATOS"] + "?t=%d" % time.time()
                  with urllib.request.urlopen(url, timeout=20) as r:
                      generado = json.load(r)["generado"]
                  minutos = (datetime.now(timezone.utc) - datetime.fromisoformat(generado)).total_seconds() / 60
                  print("Ultima publicacion hace %.0f minutos" % minutos, file=sys.stderr)
                  if minutos < 90:
                      saltar = "true"
              except Exception as e:
                  print("No se pudo leer la pagina publicada (%s); se actualiza igual." % e, file=sys.stderr)
          print("saltar=" + saltar)
          PY

  actualizar:
    needs: revisar
    if: needs.revisar.outputs.saltar != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Consultar Mercado Público y generar los datos
        env:
          MERCADO_PUBLICO_TICKET: ${{ secrets.MERCADO_PUBLICO_TICKET }}
        run: python actualizar_licitaciones.py

      - name: Guardar los datos en el repositorio
        run: |
          git config user.name "panel-licitaciones"
          git config user.email "panel-licitaciones@users.noreply.github.com"
          git add data/cache.json docs/data.json
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "Actualización de datos $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - name: Configurar la publicación
        uses: actions/configure-pages@v5

      - name: Preparar la página
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  # La publicación va en un trabajo aparte (es el esquema recomendado por GitHub): así la
  # página armada queda registrada antes de publicarla.
  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Esperar unos segundos a que GitHub registre la página
        run: sleep 30

      - name: Publicar la página
        id: deployment
        uses: actions/deploy-pages@v5
